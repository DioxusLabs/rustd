# rustd: the daemon's own checks, on its branches. The harnesses compare what rustd builds
# with what rustc builds, under both backends, on Linux x86-64, Linux AArch64, Windows x86-64
# and macOS arm64: each on a machine of its own kind, so nothing is cross-compiled or
# emulated but what `buildmodel.py` builds for other targets. One binary has both backends;
# RUSTD_BACKEND picks the one a job checks.
#
# Every job is named `kind (platform, ...)`. The harnesses a job runs are listed once, in
# harness/ci.sh, and the toolchain, LLVM and the build are .github/actions/rustd.
name: rustd
on:
  push:
    branches: ["main"]
    paths-ignore: ["site/**", "**.md", ".github/workflows/release.yaml", ".github/workflows/site.yaml"]
  # Not while a pull request is a draft: it runs when it is marked ready.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: rustd-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: tests (${{ matrix.platform }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64, macos-arm64, windows-x64]
        include:
          - { platform: linux-x64, runner: warp-ubuntu-latest-x64-8x }
          - { platform: linux-arm64, runner: warp-ubuntu-latest-arm64-8x }
          - { platform: macos-arm64, runner: warp-macos-latest-arm64-6x }
          - { platform: windows-x64, runner: warp-windows-2025-x64-8x }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/rustd
        with:
          components: -c rustfmt
          build: false
      - run: cargo fmt --all -- --check
        if: matrix.platform == 'linux-x64'
      - run: cargo test --release -p hir-ty -p hir-def -p parser -p syntax -p rustd

  # Every harness under both backends at once, on one large machine per platform: see
  # harness/ci.sh.
  harness:
    name: harness (${{ matrix.platform }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: warp-ubuntu-latest-x64-32x }
          - { platform: linux-arm64, runner: warp-ubuntu-latest-arm64-32x }
          - { platform: macos-arm64, runner: warp-macos-latest-arm64-12x }
          - { platform: windows-x64, runner: warp-windows-2025-x64-32x }
    env:
      RUSTD_OPT: 2
      RUSTD_EMIT: fast
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/rustd
      - name: Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y valgrind gdb
      # What `buildmodel.py` builds for besides the host.
      - name: Cross tools
        if: matrix.platform == 'linux-x64'
        run: |
          rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-musl
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools qemu-user
      # `debuginfo.py` has perf unwind what rustd built, which it says it did not run where
      # there is no perf or the kernel does not let this user sample.
      - name: perf
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y linux-tools-generic
          perf --version || sudo ln -sf "$(ls /usr/lib/linux-tools/*/perf | tail -n 1)" /usr/local/bin/perf
          perf --version
          sudo sysctl kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
      # MinIO as one program in the home directory, which is where remote.py looks for it and
      # needs it: it kills the service and starts it again. The image is the one that is still
      # published, for both architectures; the runner's docker takes a file out of it without
      # root.
      - name: MinIO
        if: runner.os == 'Linux'
        run: |
          image=cgr.dev/chainguard/minio@sha256:c93745c56fccdaf0e5dcb88999a96a65a136428beb045ef5d546255a80d747a7
          mkdir -p "$HOME/s3tools"
          container=$(docker create "$image")
          docker cp "$container:/usr/bin/minio" "$HOME/s3tools/minio"
          docker rm "$container"
          "$HOME/s3tools/minio" --version
      - name: Harnesses
        run: bash harness/ci.sh

  # `cargo rustd` in place of cargo on projects as they are published, under both backends at
  # once: what the programs print and what every test says has to be what cargo gives. `small`
  # is ripgrep, fd and hyperfine with the flags, the daemon's life and plain cargo; Linux
  # AArch64 builds the larger projects.
  projects:
    name: projects (${{ matrix.platform }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: warp-ubuntu-latest-x64-16x, groups: '"small"' }
          - { platform: macos-arm64, runner: warp-macos-latest-arm64-12x, groups: '"small"' }
          - { platform: linux-arm64, runner: warp-ubuntu-latest-arm64-32x, groups: '"ripgrep fd" "bat hyperfine" "just axum" "nushell"' }
    env:
      RUSTD_OPT: 2
      RUSTD_EMIT: fast
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/rustd
      - name: cargo rustd against cargo
        run: bash harness/ci.sh projects ${{ matrix.groups }}
      # The lints are rust-analyzer's whatever the backend or the platform, so they are checked once.
      - name: cargo rustd clippy against clippy
        if: matrix.platform == 'linux-x64'
        working-directory: harness
        run: rustup component add clippy --toolchain "$(cat toolchain)" && RUSTD_BIN="$GITHUB_WORKSPACE/target/release/rustd" python3 clippy.py

  # Not required to pass yet: the baseline was measured on another machine than the runner, so
  # the threshold on times is wide, and what it holds exactly is who built each step, whether
  # it was spliced and how many functions were compiled.
  bench:
    name: bench (linux-x64)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/rustd
      - name: Bench
        working-directory: harness
        run: |
          export RUSTD_BIN="$GITHUB_WORKSPACE/target/release/rustd" RUSTD_LLVM_BIN="$GITHUB_WORKSPACE/target/release/rustd"
          python3 bench.py ripgrep --out "$RUNNER_TEMP/bench.json"
          python3 bench.py --compare bench-baseline.json "$RUNNER_TEMP/bench.json" --threshold 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: ${{ runner.temp }}/bench.json
